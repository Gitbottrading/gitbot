<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Precios en Vivo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; max-width: 600px; background: #2a2a2a; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; }
        th { background-color: #00cc66; color: black; }
        .price { font-weight: bold; color: #00ffcc; }
        button { padding: 10px 20px; background: #00cc66; border: none; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 5px; }
        button:hover { background: #00aa55; }
    </style>
</head>
<body>

    <h1>🚀 Precios de Criptomonedas en Vivo</h1>
    <p>Datos obtenidos en tiempo real de CoinMarketCap</p>
    <button onclick="fetchCryptoData()">🔄 Actualizar Precios</button>

    <table>
        <thead>
            <tr>
                <th>Ranking</th>
                <th>Nombre</th>
                <th>Símbolo</th>
                <th>Precio (USD)</th>
            </tr>
        </thead>
        <tbody id="crypto-table">
            <tr>
                <td colspan="4">Cargando datos...</td>
            </tr>
        </tbody>
    </table>

        // 
        <script>
        async function fetchTop100() {
            const tbody = document.getElementById('crypto-table-body');
            
            // URL original de CoinMarketCap
            const originalUrl = "https://coinmarketcap.com";
            
            // Agregamos el proxy CORS gratuito por delante para evitar el bloqueo del navegador
            const url = "https://corsproxy.io?" + encodeURIComponent(originalUrl);
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.data && result.data.length > 0) {
                    tbody.innerHTML = ""; // Limpiar el estado de carga
                    
                    result.data.forEach(coin => {
                        const rawPrice = coin.quote.USD.price;
                        const formattedPrice = rawPrice < 1 
                            ? rawPrice.toFixed(6) 
                            : rawPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                        const row = `
                            <tr>
                                <td class="rank">${coin.cmc_rank || '-'}</td>
                                <td>
                                    <span class="coin-name">${coin.name}</span>
                                    <span class="coin-symbol">${coin.symbol}</span>
                                </td>
                                <td class="price">$${formattedPrice}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" class="loading">No se pudieron procesar los datos estructurados de la API.</td></tr>`;
                }
            } catch (error) {
                console.error("Error al obtener los datos:", error);
                tbody.innerHTML = `<tr><td colspan="3" class="loading" style="color: #ff3b30;">Error al conectar con la API. Intenta nuevamente en unos segundos.</td></tr>`;
            }
        }

        // Ejecución automática inicial al abrir la página
        fetchTop100();
    </script>

</body>
</html>
