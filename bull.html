<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bull Market Protocol - Git Bot</title>
  <style>
    /* --- RESET & CYBERPUNK BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #060913;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* --- TRADING INTERFACE GRID --- */
    .trading-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: 
        linear-gradient(rgba(16, 185, 129, 0.02) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(16, 185, 129, 0.02) 1px, transparent 1px) 0 0 / 40px 40px;
    }

    /* --- Live Price HUD Display --- */
    .hud-display {
      position: absolute;
      top: 40px;
      text-align: center;
      z-index: 10;
    }

    .ticker {
      font-size: 1.2rem;
      color: #9ca3af;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .price-value {
      font-size: 3.5rem;
      font-weight: 900;
      color: #10b981;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
      font-family: monospace;
      animation: pricePump 1.5s ease-in-out infinite alternate;
    }

    /* --- THE CANDLESTICK SYSTEM --- */
    .chart-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 400px;
      width: 200px;
    }

    /* Candle Wick (Mecha superior e inferior) */
    .wick {
      position: absolute;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, #059669, #10b981, #059669);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* Candle Real Body (Cuerpo Verde Alcista) */
    .candle-body {
      position: absolute;
      bottom: 20%;
      width: 70px;
      height: 40%;
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      border: 2px solid #34d399;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.6), inset 0 0 15px rgba(52, 211, 153, 0.4);
      z-index: 2;
      
      /* Animaciones combinadas: Micro-vibración y Expansión vertical agresiva */
      animation: 
        candlePump 5s cubic-bezier(0.25, 1, 0.5, 1) infinite,
        candleJitter 0.15s ease-in-out infinite alternate;
    }

    /* Rollercoaster / Speed Laser Line overlay */
    .coaster-line {
      position: absolute;
      width: 150vw;
      height: 2px;
      background: linear-gradient(90deg, transparent, #34d399, #ffffff, #34d399, transparent);
      box-shadow: 0 0 15px #10b981;
      transform: rotate(-15deg);
      z-index: 1;
      animation: rideLine 2.5s infinite linear;
    }

    /* --- ANIMATION KEYFRAMES --- */
    
    /* 1. La vela crece hacia arriba absorbiendo liquidez */
    @keyframes candlePump {
      0% {
        height: 25%;
        bottom: 20%;
      }
      30% {
        height: 55%;
        bottom: 20%;
      }
      35% {
        height: 48%; /* Pequeño retroceso / toma de ganancias */
        bottom: 25%;
      }
      65% {
        height: 85%; /* Ruptura de resistencia (Breakout) */
        bottom: 10%;
        box-shadow: 0 0 60px rgba(16, 185, 129, 0.9), inset 0 0 25px rgba(52, 211, 153, 0.6);
      }
      90% {
        height: 90%;
        bottom: 5%;
      }
      100% {
        height: 25%;
        bottom: 20%;
      }
    }

    /* 2. Simula el ruido y latido constante del libro de órdenes */
    @keyframes candleJitter {
      0% { transform: scaleX(1) translateX(-0.5px); filter: brightness(1); }
      100% { transform: scaleX(1.03) translateX(0.5px); filter: brightness(1.15); }
    }

    /* 3. El contador numérico reacciona al bombeo */
    @keyframes pricePump {
      0% { content: "$53,240.15"; transform: scale(1); }
      100% { content: "$58,910.88"; transform: scale(1.05); color: #34d399; }
    }

    /* 4. Efecto montaña rusa laser cruzando la pantalla */
    @keyframes rideLine {
      0% {
        transform: translate(-50%, 100px) rotate(-20deg);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translate(50%, -200px) rotate(-20deg);
        opacity: 0;
      }
    }

    /* --- BANNER INFERIOR --- */
    .status-banner {
      position: absolute;
      bottom: 40px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #34d399;
      text-transform: uppercase;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="trading-screen">
    
    <!-- HUD de Precio Dinámico -->
    <div class="hud-display">
      <div class="ticker">BTC / USD • BREAKOUT DETECTED</div>
      <div class="price-value">$64,892.40</div>
    </div>

    <!-- Estela de velocidad láser estilo montaña rusa -->
    <div class="coaster-line"></div>

    <!-- Gráfico de la Vela Alcista -->
    <div class="chart-container">
      <div class="wick"></div>
      <div class="candle-body"></div>
    </div>

    <!-- Etiqueta de Estado de Git Bot -->
    <div class="status-banner">
      🎢 Escalator Mode: Active
    </div>

  </div>

</body>
</html>
