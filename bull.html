<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bull Market Protocol - Git Bot</title>
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

  <!-- Ticker Tape Desplazándose de Izquierda a Derecha -->
  <div class="ticker-tape">
    <div class="ticker-wrapper" id="ticker-content"></div>
  </div>

  <div class="trading-screen">
    
    <!-- Fondo estelar dinámico -->
    <canvas class="stars-background" id="starsCanvas"></canvas>
    
    <!-- HUD de Precio Principal (BTC Activo) -->
    <div class="hud-display">
      <div class="ticker-title">BTC / USD • CELESTIAL ALIGNMENT</div>
      <div class="price-value" id="live-price">$77,427.38</div>
    </div>

    <!-- Contenedor del Toro en Constelación -->
    <div class="constellation-container">
      <svg class="bull-svg" viewBox="0 0 600 450">
        <!-- Líneas que unen las estrellas del Toro (Taurus) -->
        <line class="constellation-line" x1="150" y1="50" x2="280" y2="180" />
        <line class="constellation-line" x1="120" y1="140" x2="280" y2="180" />
        <line class="constellation-line" x1="280" y1="180" x2="330" y2="210" />
        <line class="constellation-line" x1="280" y1="180" x2="300" y2="260" />
        <line class="constellation-line" x1="330" y1="210" x2="300" y2="260" />
        <line class="constellation-line" x1="330" y1="210" x2="480" y2="230" />
        <line class="constellation-line" x1="300" y1="260" x2="430" y2="340" />
        <line class="constellation-line" x1="480" y1="230" x2="430" y2="340" />
        <line class="constellation-line" x1="480" y1="230" x2="550" y2="200" />
        <line class="constellation-line" x1="430" y1="340" x2="490" y2="400" />

        <!-- Nodos de Estrellas -->
        <circle class="star-node" cx="150" cy="50" r="4" />
        <circle class="star-node" cx="120" cy="140" r="4" />
        <circle class="star-node" cx="280" cy="180" r="4" />
        <circle class="star-node" cx="300" cy="260" r="4" />
        <circle class="star-node" cx="430" cy="340" r="4" />
        <circle class="star-node" cx="480" cy="230" r="4" />
        <circle class="star-node" cx="550" cy="200" r="3" />
        <circle class="star-node" cx="490" cy="400" r="3" />
        
        <!-- ESTRELLA ALDEBARÁN (El ojo brillante del Toro en color verde GitBot) -->
        <circle class="aldebaran" cx="330" cy="210" r="8" />
      </svg>
    </div>

    <div class="status-banner">
      ✨ Constellation Bull Mode: Active
    </div>

  </div>

  <!-- Enlace al archivo JavaScript externo -->
  <script src="script/script.js"></script>
</body>
</html>
