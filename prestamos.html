<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Préstamos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        h2, h3 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .resultado-box { background: #e9ecef; padding: 15px; border-radius: 6px; margin-top: 20px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; display: none; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador de Préstamos</h2>
    <div class="form-group">
        <label for="monto">Monto del Préstamo ($):</label>
        <input type="number" id="monto" min="1" step="any" required>
    </div>

    <div class="form-group">
        <label for="meses">Plazo (Meses):</label>
        <input type="number" id="meses" min="1" required>
    </div>

    <div class="form-group">
        <label for="interes">Tasa de Interés Mensual:</label>
        <select id="interes" required>
            <option value="2">2 %</option>
            <option value="4">4 %</option>
            <option value="6">6 %</option>
            <option value="8">8 %</option>
            <option value="10">10 %</option>
        </select>
    </div>

    <button onclick="calcularPrestamo()">Calcular Préstamo</button>

    <!-- Caja de Resultados -->
    <div id="resultadoBox" class="resultado-box">
        <h3>Resumen del Préstamo</h3>
        <p><strong>Total Intereses:</strong> $<span id="resInteres">0.00</span></p>
        <p><strong>Total a Pagar:</strong> $<span id="resTotal">0.00</span></p>
        <p><strong>Cuota Mensual Fija:</strong> $<span id="resCuota">0.00</span></p>
    </div>

    <!-- Tabla de Amortización -->
    <table id="tablaAmortizacion">
        <thead>
            <tr>
                <th>Mes</th>
                <th>Cuota</th>
                <th>Capital</th>
                <th>Interés</th>
                <th>Saldo Restante</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo"></tbody>
    </table>
</div>

<script>
function calcularPrestamo() {
    // Obtener valores
    const monto = parseFloat(document.getElementById('monto').value);
    const meses = parseInt(document.getElementById('meses').value);
    const interesPorcentaje = parseInt(document.getElementById('interes').value);

    // Validar campos vacíos
    if (isNaN(monto) || isNaN(meses) || monto <= 0 || meses <= 0) {
        alert("Por favor, ingrese valores válidos.");
        return;
    }

    // Cálculos
    const tasaMensual = interesPorcentaje / 100;
    const totalInteres = monto * tasaMensual * meses;
    const totalPagar = monto + totalInteres;
    const cuotaMensual = totalPagar / meses;
    const capitalMensual = monto / meses;
    const interesMensual = totalInteres / meses;

    // Mostrar resumen
    document.getElementById('resInteres').innerText = totalInteres.toFixed(2);
    document.getElementById('resTotal').innerText = totalPagar.toFixed(2);
    document.getElementById('resCuota').innerText = cuotaMensual.toFixed(2);
    document.getElementById('resultadoBox').style.display = 'block';

    // Generar Tabla
    const tablaCuerpo = document.getElementById('tablaCuerpo');
    tablaCuerpo.innerHTML = ""; // Limpiar tabla previa
    let saldoRestante = totalPagar;

    for (let i = 1; i <= meses; i++) {
        saldoRestante -= cuotaMensual;
        if (i === meses) saldoRestante = 0; // Ajuste decimales final

        const fila = `<tr>
            <td>${i}</td>
            <td>$${cuotaMensual.toFixed(2)}</td>
            <td>$${capitalMensual.toFixed(2)}</td>
            <td>$${interesMensual.toFixed(2)}</td>
            <td>$${Math.abs(saldoRestante).toFixed(2)}</td>
        </tr>`;
        tablaCuerpo.innerHTML += fila;
    }

    document.getElementById('tablaAmortizacion').style.display = 'table';
}
</script>

</body>
</html>
