<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Préstamos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulador de Préstamos</h2>
    <form action="php/procesar.php" method="POST">
        <div class="form-group">
            <label for="monto">Monto del Préstamo ($):</label>
            <input type="number" id="monto" name="monto" min="1" step="any" required>
        </div>

        <div class="form-group">
            <label for="meses">Plazo (Meses):</label>
            <input type="number" id="meses" name="meses" min="1" required>
        </div>

        <div class="form-group">
            <label for="interes">Tasa de Interés Mensual:</label>
            <select id="interes" name="interes" required>
                <option value="2">2 %</option>
                <option value="4">4 %</option>
                <option value="6">6 %</option>
                <option value="8">8 %</option>
                <option value="10">10 %</option>
            </select>
        </div>

        <button type="submit">Calcular Préstamo</button>
    </form>
</div>

</body>
</html>
