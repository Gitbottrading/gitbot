<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Circular de Marcas de Lujo</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #d4af37;
            margin-bottom: 40px;
        }

        /* Contenedor del círculo */
        .circle-container {
            position: relative;
            width: 500px;
            height: 500px;
            border: 2px dashed #333333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Centro del círculo */
        .circle-center {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #2a2a2a, #1a1a1a);
            border: 3px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            z-index: 10;
        }

        /* Elementos de la lista */
        .circle-item {
            position: absolute;
            width: 110px;
            height: 40px;
            background-color: #222222;
            border: 1px solid #d4af37;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, background-color 0.3s ease;
            
            /* Fórmula matemática CSS para posicionar en círculo (36 grados por elemento) */
            --angle: calc(var(--i) * 36deg);
            transform: rotate(var(--angle)) translate(220px) rotate(calc(-1 * var(--angle)));
        }

        .circle-item:hover {
            background-color: #d4af37;
            color: #121212;
            transform: rotate(var(--angle)) translate(230px) rotate(calc(-1 * var(--angle))) scale(1.1);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Top 10 Marcas</h1>

    <div class="circle-container">
        <div class="circle-center">LUJO</div>
        
        <!-- Se usa la variable --i para calcular la posición exacta de cada una -->
        <div class="circle-item" style="--i: 0;">Aston Martin</div>
        <div class="circle-item" style="--i: 1;">Bentley</div>
        <div class="circle-item" style="--i: 2;">Bugatti</div>
        <div class="circle-item" style="--i: 3;">Ferrari</div>
        <div class="circle-item" style="--i: 4;">Hummer</div>
        <div class="circle-item" style="--i: 5;">Jeep</div>
        <div class="circle-item" style="--i: 6;">Lamborghini</div>
        <div class="circle-item" style="--i: 7;">Maserati</div>
        <div class="circle-item" style="--i: 8;">Porsche</div>
        <div class="circle-item" style="--i: 9;">Rolls-Royce</div>
    </div>

</body>
</html>
