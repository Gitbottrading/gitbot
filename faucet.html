<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi ERC20 Faucet Semanal</title>
    <!-- Cargamos Ethers.js v6 de forma oficial desde CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: #ffffff;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        .info-box {
            background-color: #eef2f7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5568;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            background-color: #f8fafc;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #fff;
        }
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        #connectBtn {
            background-color: #f59e0b;
            color: white;
        }
        #connectBtn:hover { background-color: #d97706; }
        
        #claimBtn {
            background-color: #3b82f6;
            color: white;
        }
        #claimBtn:hover { background-color: #2563eb; }
        #claimBtn:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
        }
        
        #addTokenBtn {
            background-color: #10b981;
            color: white;
        }
        #addTokenBtn:hover { background-color: #059669; }

        #status {
            padding: 12px;
            border-radius: 6px;
            background-color: #f8fafc;
            border-left: 4px solid #94a3b8;
            font-weight: 500;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Grifo Semanal (0.005)</h2>
    
    <div class="info-box">
        <p><strong>Frecuencia:</strong> Reclamos activos cada viernes a las 7:00 PM UTC</p>
        <p><strong>Red:</strong> Sepolia Testnet</p>
        <p><strong>Tokens restantes en el Faucet:</strong> <span id="faucetBalance" style="font-weight: bold; color: #2563eb;">Cargando...</span></p>
    </div>

    <!-- Campo para pegar o autocompletar billetera -->
    <div class="form-group">
        <label for="walletAddress">Dirección de la billetera de destino:</label>
        <input type="text" id="walletAddress" placeholder="Introduce o pega tu dirección 0x...">
    </div>

    <!-- Botonera interactiva -->
    <div class="btn-container">
        <button id="connectBtn">1. Conectar MetaMask</button>
        <button id="claimBtn" disabled>2. Reclamar 0.005 Tokens</button>
        <button id="addTokenBtn">➕ Añadir Token a Wallet</button>
    </div>

    <!-- Mensajes de estado del sistema -->
    <div id="status">Por favor, conecta tu MetaMask para comenzar.</div>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="Javascript/faucet.js"></script>
</body>
</html>
