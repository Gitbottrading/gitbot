<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Faucet ERC-20</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="faucet-container">
        <header>
            <div class="bitcoin-logo">🪙</div>
            <h1>ERC-20 Faucet</h1>
            <p>Reclama tus tokens cada viernes a las 7:00 PM</p>
        </header>

        <main>
            <!-- Botón de Conexión Web3 -->
            <button id="connect-btn" class="btn-connect">Conectar Billetera</button>
            <p id="wallet-address" class="wallet-address"></p>

            <!-- Panel de Balance -->
            <div class="balance-card">
                <span class="balance-label">Tu Balance en el Contrato</span>
                <div class="balance-amount">
                    <span id="user-balance">0.00</span> <span class="currency" id="token-symbol">TOKEN</span>
                </div>
            </div>

            <!-- Zona de Reclamo -->
            <div class="claim-box">
                <div id="timer-display" class="timer hidden">Próximo reclamo disponible en: <span id="countdown">--:--:--</span></div>
                <button id="claim-btn" class="btn-claim" disabled>Reclamar Tokens</button>
                <p id="message" class="message"></p>
            </div>
        </main>

        <section class="history-section">
            <h3>Estado del Faucet</h3>
            <div class="faucet-info">
                <p>Dirección del Token: <span id="token-address-ui">0x...</span></p>
            </div>
        </section>
    </div>

    <!-- Incluimos Ethers.js v6 mediante CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="script.js"></script>
</body>
</html>
