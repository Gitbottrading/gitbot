<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constelación de Tauro Celestial</title>
    <style>
        /* Fondo Cósmico */
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #0d1b2a 0%, #0b0c10 70%, #010203 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Polvo de estrellas de fondo (Nebulosa básica) */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 40% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 60% 60%, rgba(0, 150, 255, 0.05) 0%, transparent 50%);
            animation: nebulaShift 20s infinite alternate linear;
            z-index: 1;
        }

        /* Contenedor de la Constelación */
        .constellation-container {
            position: relative;
            width: 600px;
            height: 600px;
            z-index: 2;
        }

        /* Estrellas / Nodos de la constelación */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px 4px rgba(255, 215, 0, 0.8), 
                        0 0 25px 8px rgba(255, 255, 255, 0.6);
            animation: pulse 3s infinite ease-in-out;
            z-index: 4;
        }

        /* Estrella principal (Aldebarán - El ojo del toro) */
        .star.aldebaran {
            width: 14px;
            height: 14px;
            box-shadow: 0 0 20px 6px rgba(255, 69, 0, 0.9), 
                        0 0 40px 15px rgba(255, 140, 0, 0.6);
            background-color: #ffebd7;
        }

        .star.medium { width: 8px; height: 8px; }
        .star.small { width: 5px; height: 5px; }

        /* Líneas de unión doradas */
        .line {
            position: absolute;
            background: linear-gradient(90deg, rgba(255,215,0,0.8) 0%, rgba(212,175,55,0.3) 50%, rgba(255,215,0,0.8) 100%);
            height: 2px;
            transform-origin: left center;
            box-shadow: 0 0 8px #ffd700, 0 0 3px #fff;
            filter: blur(0.5px);
            z-index: 3;
            opacity: 0.8;
        }

        /* Posicionamiento de los Nodos (Coordenadas del Toro) */
        .s1 { top: 150px; left: 150px; } /* Cuerno Izquierdo */
        .s2 { top: 220px; left: 280px; } /* Base Cuerno Izquierdo */
        .s3 { top: 100px; left: 450px; } /* Cuerno Derecho */
        .s4 { top: 250px; left: 350px; } /* Base Cuerno Derecho */
        .s5 { top: 320px; left: 300px; } /* Aldebarán (Ojo) */
        .s6 { top: 290px; left: 240px; } /* Nariz/Hocico */
        .s7 { top: 380px; left: 210px; } /* Mandíbula */
        .s8 { top: 430px; left: 130px; } /* Cuerpo/Espalda */

        /* Posicionamiento y rotación de las líneas conectoras */
        .l1 { top: 152px; left: 152px; width: 148px; transform: rotate(28deg); }  /* S1 a S2 */
        .l2 { top: 102px; left: 452px; width: 142px; transform: rotate(123deg); } /* S3 a S4 */
        .l3 { top: 222px; left: 282px; width: 73px;  transform: rotate(23deg); }  /* S2 a S4 */
        .l4 { top: 252px; left: 352px; width: 58px;  transform: rotate(125deg); } /* S4 a S5 */
        .l5 { top: 222px; left: 282px; width: 56px;  transform: rotate(120deg); } /* S2 a S6 */
        .l6 { top: 292px; left: 242px; width: 63px;  transform: rotate(26deg); }  /* S6 a S5 */
        .l7 { top: 292px; left: 242px; width: 94px;  transform: rotate(111deg); } /* S6 a S7 */
        .l8 { top: 322px; left: 302px; width: 114px; transform: rotate(146deg); } /* S5 a S7 */
        .l9 { top: 382px; left: 212px; width: 113px; transform: rotate(212deg); } /* S7 a S8 */

        /* Animaciones */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 20px 8px rgba(255, 215, 0, 1); }
        }

        @keyframes nebulaShift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -5%) scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="constellation-container">
        <!-- Puntos/Estrellas -->
        <div class="star medium s1"></div>
        <div class="star small s2"></div>
        <div class="star medium s3"></div>
        <div class="star small s4"></div>
        <div class="star aldebaran s5"></div> <!-- Aldebarán -->
        <div class="star small s6"></div>
        <div class="star small s7"></div>
        <div class="star medium s8"></div>

        <!-- Líneas Conectoras -->
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="line l4"></div>
        <div class="line l5"></div>
        <div class="line l6"></div>
        <div class="line l7"></div>
        <div class="line l8"></div>
        <div class="line l9"></div>
    </div>

</body>
</html>
