<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toro Celestial de Oro - Constelación SVG</title>
    <link rel="stylesheet" href="css/toro.css">
</head>
<body>

    <div class="canvas-container">
        <svg viewBox="0 0 800 800" xmlns="http://w3.org">
            <defs>
                <!-- Degradado de Oro Líquido Brillante -->
                <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffe875" />
                    <stop offset="30%" stop-color="#f7b731" />
                    <stop offset="70%" stop-color="#ffdd59" />
                    <stop offset="100%" stop-color="#d4af37" />
                </linearGradient>

                <!-- Degradado de Oro Suave para los músculos internos -->
                <linearGradient id="gold-gradient-soft" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#f7b731" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#9a7b1c" stop-opacity="0.5" />
                </linearGradient>

                <!-- Filtro de Resplandor Cósmico (Glow Neón) -->
                <filter id="cosmic-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="blur1" />
                    <feGaussianBlur stdDeviation="6" result="blur2" />
                    <feGaussianBlur stdDeviation="15" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur3" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Filtro de Resplandor sutil para detalles -->
                <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- POLVO DE ESTRELLAS MINIATURA (Ambiente) -->
            <g fill="#ffffff" opacity="0.4">
                <circle cx="150" cy="200" r="1" /> <circle cx="650" cy="150" r="1.5" />
                <circle cx="200" cy="600" r="1.2" /> <circle cx="700" cy="550" r="1" />
                <circle cx="100" cy="450" r="1.8" /> <circle cx="550" cy="700" r="1.2" />
                <circle cx="450" cy="100" r="1.5" /> <circle cx="320" cy="180" r="1" />
            </g>

            <!-- SILUETA DEL TORO -->
            <g id="toro-graphics">
                <!-- SILUETA EXTERIOR PRINCIPAL (Contorno Dinámico) -->
                <path class="toro-outline" d="
                    M 400 320 
                    C 380 260, 310 180, 240 120 
                    C 255 180, 280 230, 310 270 
                    C 260 275, 210 290, 170 320 
                    C 150 335, 140 360, 160 380
                    C 180 395, 230 400, 280 395
                    C 250 430, 230 480, 220 540
                    C 240 550, 270 540, 290 500
                    C 320 440, 350 410, 410 415
                    C 460 420, 520 450, 560 520
                    C 580 540, 600 540, 610 510
                    C 590 440, 570 390, 600 330
                    C 640 280, 710 230, 750 200
                    C 700 230, 640 260, 610 290
                    C 570 260, 500 280, 440 300 
                    Z
                " />

                <!-- DETALLES INTERNOS (Músculos del pecho, lomo y patas) -->
                <path class="toro-details" d="M 270 145 C 290 200, 320 230, 345 270" />
                <path class="toro-details" d="M 690 220 C 640 250, 610 270, 575 295" />
                <path class="toro-details" d="M 310 270 C 330 300, 380 330, 410 415" />
                <path class="toro-details" d="M 440 300 C 420 330, 400 350, 410 415" />
                <path class="toro-details" d="M 230 350 C 200 360, 180 370, 195 380" />
                <path class="toro-details" d="M 345 295 C 290 320, 270 360, 290 395" />
                <path class="toro-details" d="M 390 340 C 350 370, 340 400, 355 412" />
                <path class="toro-details" d="M 320 410 C 290 430, 270 460, 260 500" />
                <path class="toro-details" d="M 440 300 C 480 320, 530 360, 555 420" />
                <path class="toro-details" d="M 490 345 C 520 380, 540 420, 520 470" />
                <path class="toro-details" d="M 525 435 C 550 460, 560 480, 580 495" />
            </g>

            <!-- GEOMETRÍA DE LA CONSTELACIÓN -->
            <g id="constellation">
                <!-- Líneas de la Constelación -->
                <polyline class="constellation-line" points="240,120 310,270 410,360 440,300 750,200" />
                <polyline class="constellation-line" points="310,270 230,350 195,380 290,395 410,360" />
                <polyline class="constellation-line" points="410,360 520,380 560,520" />
                <line class="constellation-line" x1="290" y1="395" x2="260" y2="500" />

                <!-- Nodos / Estrellas -->
                <circle class="star" cx="240" cy="120" r="5" />
                <circle class="star" cx="750" cy="200" r="5" />
                <circle class="star" cx="310" cy="270" r="4" />
                <circle class="star" cx="440" cy="300" r="4" />
                <circle class="aldebaran" cx="410" cy="360" r="8" style="transform-origin: 410px 360px;" />
                <circle class="star" cx="230" cy="350" r="3.5" />
                <circle class="star" cx="195" cy="380" r="4.5" />
                <circle class="star" cx="290" cy="395" r="4" />
                <circle class="star" cx="260" cy="500" r="4" />
                <circle class="star" cx="520" cy="380" r="3.5" />
                <circle class="star" cx="560" cy="520" r="4.5" />
            </g>
        </svg>
    </div>

</body>
</html>
