
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toro Celestial Anatómico - SVG Constelación</title>
    <link rel="stylesheet" href="css/toro.css">
</head>
<body>

    <div class="canvas-container">
        <svg viewBox="0 0 1000 800" xmlns="http://w3.org">
            <defs>
                <!-- Degradado de Oro Líquido Intenso -->
                <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fff4b8" />
                    <stop offset="25%" stop-color="#ffca36" />
                    <stop offset="60%" stop-color="#e09d00" />
                    <stop offset="100%" stop-color="#8c6200" />
                </linearGradient>

                <!-- Degradado de Oro Suave para Sombras y Músculos -->
                <linearGradient id="gold-gradient-soft" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffca36" stop-opacity="0.8" />
                    <stop offset="100%" stop-color="#543c00" stop-opacity="0.3" />
                </linearGradient>

                <!-- Filtro de Resplandor Neón Cósmico -->
                <filter id="cosmic-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="blur1" />
                    <feGaussianBlur stdDeviation="7" result="blur2" />
                    <feGaussianBlur stdDeviation="18" result="blur3" />
                    <feMerge>
                        <feMergeNode in="blur3" />
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Filtro de Resplandor Atenuado -->
                <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <!-- POLVO DE ESTRELLAS DE AMBIENTE -->
            <g fill="#ffffff" opacity="0.3">
                <circle cx="100" cy="150" r="1" /> <circle cx="850" cy="120" r="1.5" />
                <circle cx="150" cy="650" r="1.2" /> <circle cx="900" cy="500" r="1" />
                <circle cx="50" cy="400" r="1.5" /> <circle cx="750" cy="700" r="1.2" />
                <circle cx="500" cy="80" r="1.3" /> <circle cx="380" cy="200" r="1" />
            </g>

            <!-- ================= SILUETA ANATÓMICA DEL TORO ================= -->
            <g id="toro-real-anatomy">
                
                <!-- CONTORNO PRINCIPAL REALISTA -->
                <path class="toro-outline" d="
                    M 350 420 
                    C 320 400, 270 380, 240 330 
                    C 230 310, 210 240, 190 220
                    C 200 235, 230 250, 250 255 
                    C 225 215, 210 160, 215 110
                    C 225 140, 250 190, 275 220
                    C 290 190, 310 180, 335 185
                    C 345 220, 340 250, 330 280
                    C 350 310, 345 350, 350 370
                    C 380 320, 420 230, 490 210
                    C 540 195, 620 220, 710 230
                    C 760 235, 800 260, 830 310
                    C 850 340, 820 400, 840 480
                    C 825 475, 810 440, 805 400
                    C 770 450, 750 540, 765 650
                    C 745 655, 725 650, 725 620
                    C 730 550, 720 500, 680 470
                    C 660 520, 640 590, 645 660
                    C 625 665, 610 660, 615 630
                    C 625 560, 610 490, 545 460
                    C 460 470, 430 460, 400 480
                    C 380 530, 360 610, 370 680
                    C 350 685, 330 680, 335 640
                    C 345 570, 350 510, 310 480
                    C 295 520, 280 580, 285 645
                    C 265 650, 250 645, 252 615
                    C 265 540, 280 470, 270 440
                    C 230 450, 200 410, 205 385
                    C 210 360, 240 345, 265 355
                    C 290 365, 320 390, 350 420
                    Z
                " />

                <!-- MÚSCULOS INTERNOS Y DETALLES DE PODER -->
                <!-- Cuello y Giba (Morrillo) -->
                <path class="toro-details" d="M 335 185 C 380 200, 440 215, 470 240" />
                <path class="toro-details" d="M 350 310 C 390 300, 430 280, 460 250" />
                
                <!-- Detalles de la Cabeza y Ojo -->
                <path class="toro-details" d="M 275 220 C 270 250, 285 280, 265 315" />
                <path class="toro-details" d="M 240 330 C 255 335, 270 325, 285 315" />
                
                <!-- Pecho y Hombro Delantero (Gran musculatura) -->
                <path class="toro-details" d="M 350 370 C 310 390, 290 420, 300 450" />
                <path class="toro-details" d="M 350 420 C 370 460, 350 510, 340 550" />
                <path class="toro-details" d="M 310 480 C 325 520, 320 570, 315 620" />

                <!-- Costillar y Flanco central -->
                <path class="toro-details" d="M 490 210 C 495 280, 470 360, 430 430" />
                <path class="toro-details" d="M 550 220 C 540 290, 520 370, 490 445" />

                <!-- Grupo Muscular Trasero (Anca y Pierna) -->
                <path class="toro-details" d="M 710 230 C 690 300, 660 380, 600 440" />
                <path class="toro-details" d="M 780 320 C 740 360, 710 420, 715 480" />
                <path class="toro-details" d="M 680 470 C 665 510, 655 560, 660 610" />
                <path class="toro-details" d="M 725 500 C 740 530, 745 570, 750 615" />
            </g>

            <!-- ================= GEOMETRÍA DE LA CONSTELACIÓN ================= -->
            <g id="constellation">
                <!-- Líneas de la Unión de Estrellas -->
                <polyline class="constellation-line" points="215,110 275,220 285,315 240,330 205,385 300,450 430,430 600,440 715,480" />
                <polyline class="constellation-line" points="275,220 335,185 470,240 490,210 710,230 830,310" />
                <line class="constellation-line" x1="300" y1="450" x2="335" y2="640" />
                <line class="constellation-line" x1="600" y1="440" x2="645" y2="630" />

                <!-- Estrellas Principales -->
                <circle class="star" cx="215" cy="110" r="5.5" />     <!-- Punta Cuerno Izquierdo -->
                <circle class="star" cx="335" cy="185" r="5" />       <!-- Punta Cuerno Derecho -->
                <circle class="star" cx="275" cy="220" r="4" />       <!-- Testuz/Frente -->
                <circle class="aldebaran" cx="285" cy="315" r="8.5" style="transform-origin: 285px 315px;" /> <!-- Aldebarán (Ojo de Fuego) -->
                <circle class="star" cx="240" cy="330" r="4.5" />     <!-- Hocico Superior -->
                <circle class="star" cx="205" cy="385" r="4" />       <!-- Mentón -->
                <circle class="star" cx="300" cy="450" r="5" />       <!-- Espalda Alta / Cruz -->
                <circle class="star" cx="470" cy="240" r="4" />       <!-- Giba / Morrillo -->
                <circle class="star" cx="490" cy="210" r="3.5" />     <!-- Lomo -->
                <circle class="star" cx="430" cy="430" r="4.5" />     <!-- Vientre -->
                <circle class="star" cx="335" cy="640" r="4" />       <!-- Pezuña Delantera -->
                <circle class="star" cx="600" cy="440" r="4.5" />     <!-- Cadera Trasera -->
                <circle class="star" cx="645" cy="630" r="4" />       <!-- Pezuña Trasera -->
                <circle class="star" cx="710" cy="230" r="3.5" />     <!-- Grupa -->
                <circle class="star" cx="830" cy="310" r="5" />       <!-- Nacimiento de Cola -->
            </g>
        </svg>
    </div>

</body>
</html>
